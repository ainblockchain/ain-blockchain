services:
  neo4j:
    image: neo4j:5
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: "${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-neo4jpassword}"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  ain-blockchain:
    build: .
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
      - "${P2P_PORT:-4998}:${P2P_PORT:-4998}"
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      SEASON: "${SEASON:-standalone}"
      ACCOUNT_INJECTION_OPTION: "${ACCOUNT_INJECTION_OPTION:-private_key}"
      UNSAFE_PRIVATE_KEY: "${UNSAFE_PRIVATE_KEY:-b22c95ffc4a5c096f7d7d0487ba963ce6ac945bdc91c79b64ce209de289bec96}"
      ENABLE_KNOWLEDGE_GRAPH_INDEX: "true"
      KNOWLEDGE_GRAPH_BACKEND: "neo4j"
      KNOWLEDGE_NEO4J_URI: "bolt://neo4j:7687"
      KNOWLEDGE_NEO4J_USERNAME: "${NEO4J_USERNAME:-neo4j}"
      KNOWLEDGE_NEO4J_PASSWORD: "${NEO4J_PASSWORD:-neo4jpassword}"
      PORT: "${PORT:-8080}"
      P2P_PORT: "${P2P_PORT:-4998}"
    volumes:
      - blockchain_data:/home/ain_blockchain_data

volumes:
  neo4j_data:
  neo4j_logs:
  blockchain_data:
